title: EE5127 Internet of Things
description: Laboratory tutorials for Electronic and Computer Engineering
lang: en-IE
# Set these to the chosen GitHub Pages address before publication.
url: "https://adnanelahi.github.io"
baseurl: "/ee5127-iot"
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
enable_copy_code_button: true
callouts:
  note:
    title: Note
    color: blue
  observation:
    title: Expected observation
    color: green
  warning:
    title: Caution
    color: yellow
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
